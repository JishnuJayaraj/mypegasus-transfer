name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA (ADR-0005).
# pnpm's version comes from the packageManager field in package.json.

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The committed OpenAPI document and client types must match the API (ADR-0010), the
      # generated docs tables the domain code, the config JSON Schema the Zod model, the
      # template manifest the template files and the forms manifest the form registry (ADR-0009).
      - name: Generated files drift
        run: |
          pnpm generate
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts packages/config/schema packages/config/templates/manifest.json packages/forms/templates/manifest.json docs/domain/generated

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Existing template and form versions must be unchanged against the PR's base, or on main
      # against the previous commit (regional-variation.md, template versions; ADR-0009); the
      # check fails under CI without it.
      TEMPLATE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so the base commit is there for the immutability check.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Oxlint, Oxfmt check, the guard against ignoreDeprecations in tsconfig*.json and the
      # template and form immutability check
      - run: pnpm lint

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: what cloud sessions ship; drop it when they move to 24 (D10).
        node: [22, 24]
    services:
      postgres:
        # Same major version as dev and the cluster (ADR-0005); the tag is pinned by digest.
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # The Gotenberg contract test of the PDF adapter (ADR-0006); the tag is pinned by digest.
      gotenberg:
        image: gotenberg/gotenberg:8.37.0-chromium@sha256:0d28ae9a96441588ef739623726bd500ad0720b77266c6f1351a13e333fbd61c
        ports:
          - 3000:3000
    env:
      # Dev roles with non-secret dev passwords (.env.example); tests switch to transfer_test.
      DATABASE_URL: postgres://transfer_app:transfer_app_dev@localhost:5432/transfer
      DATABASE_MIGRATION_URL: postgres://transfer_owner:transfer_owner_dev@localhost:5432/transfer
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      GOTENBERG_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      # The Node 24 leg also enforces the 100 % coverage thresholds (Slice 1 plan, section 6).
      - run: pnpm ${{ matrix.node == 24 && 'test:coverage' || 'test' }}

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Playwright switches these to transfer_e2e (reset and seeded before the run).
      DATABASE_URL: postgres://transfer_app:transfer_app_dev@localhost:5432/transfer
      DATABASE_MIGRATION_URL: postgres://transfer_owner:transfer_owner_dev@localhost:5432/transfer
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      - run: pnpm build
      # CI always installs the browser matching the pinned Playwright (spike S2).
      - run: pnpm --filter @transfer/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Synthetic data only, so the report and traces may be uploaded.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://transfer_app:transfer_app_dev@localhost:5432/transfer
      DATABASE_MIGRATION_URL: postgres://transfer_owner:transfer_owner_dev@localhost:5432/transfer
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dev roles and databases from the same SQL as `pnpm db:setup` (no Node needed here).
      - run: psql --quiet --no-psqlrc "$DATABASE_ADMIN_URL" -f packages/db/sql/setup.sql
      # Built and smoke-tested, never pushed in Slice 0 (registry push: Slice 9).
      - run: docker build -t transfer:ci .
      # Non-root, migration, then /api/v1/health/ready, / and /portal/ (AC-22).
      - run: scripts/image-smoke.sh transfer:ci
