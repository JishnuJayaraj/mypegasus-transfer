<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @page {
        size: A4;
      }
      body {
        font-family: "Noto Sans", "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 10pt;
        line-height: 1.35;
        color: #000;
        margin: 0;
        /* a word longer than its line breaks anywhere rather than run off the page */
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      h1 {
        font-size: 13pt;
        margin: 0 0 4mm;
      }
      h2 {
        font-size: 11pt;
        margin: 6mm 0 2mm;
        break-after: avoid;
      }
      .person {
        margin: 0 0 6mm;
      }
      .text {
        white-space: pre-wrap;
        margin: 0;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      th,
      td {
        border: 0.5pt solid #000;
        padding: 1.5mm 2mm;
        text-align: start;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      thead {
        display: table-header-group;
      }
      tr {
        break-inside: avoid;
      }
    </style>
  </head>
  <body>
    <h1>{{title}}</h1>
    <p class="person">{{person}}</p>
    {{sections}}
  </body>
</html>
