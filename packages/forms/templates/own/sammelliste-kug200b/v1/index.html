<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @page {
        size: A4 landscape;
      }
      body {
        font-family: "Noto Sans", "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 9pt;
        line-height: 1.3;
        color: #000;
        margin: 0;
        /* a word longer than its cell breaks anywhere rather than run off the page */
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      h1 {
        font-size: 13pt;
        margin: 0 0 2mm;
      }
      .subtitle {
        margin: 0 0 5mm;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        margin: 0 0 6mm;
      }
      th,
      td {
        border: 0.5pt solid #000;
        padding: 1.2mm 1.5mm;
        text-align: start;
        vertical-align: top;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .header th {
        width: 45%;
        font-weight: normal;
      }
      .list th:first-child {
        width: 6mm;
      }
      thead {
        display: table-header-group;
      }
      tr {
        break-inside: avoid;
      }
    </style>
  </head>
  <body>
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    {{header}} {{list}}
  </body>
</html>
